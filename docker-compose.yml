version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision_attendance_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=0
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=prod_super_secret_key_change_me_in_env
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin_strong_password
      - DATABASE_URL=postgresql://attendance_user:attendance_pass@db:5432/attendance_db
      - CONFIDENCE_THRESHOLD=75
      - COOLDOWN_SECONDS=300
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: vision_attendance_db
    restart: always
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  postgres_data:
